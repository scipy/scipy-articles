[workspace]
name = "SciPy 2.0 paper"
authors = ["SciPy Developers"]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64", "win-64"]

[feature.latex.dependencies]
tectonic = "*"
chktex = "*"

[feature.latex.tasks]
build = { cmd = "tectonic -X build --keep-logs", description = "Build the paper PDF" }
watch = { cmd = "tectonic -X watch", description = "Watch the source and rebuild the paper" }
lint = { cmd = "chktex src/paper.tex", description = "Lint the LaTeX source" }

[feature.python.dependencies]
python = ">=3.12"

[feature.python.pypi-dependencies]
scipy = { index = "https://pypi.anaconda.org/scientific-python-nightly-wheels/simple" }

[feature.numpy.dependencies]
numpy = ">=2.0"

[feature.plot.dependencies]
matplotlib = "*"

[feature.plot.tasks]
plot-qmc = { cmd = "python scripts/plot_qmc.py", description = "Make QMC figure" }

[environments]
default = ["python", "latex"]
latex = ["latex"]
python = ["python"]
plot = ["python", "plot", "numpy"]