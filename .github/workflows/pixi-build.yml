name: Pixi Build (scipy-2.0)

on:
  push:
    paths:
      - "scipy-2.0/**"
      - ".github/workflows/pixi-build.yml"
  pull_request:
    paths:
      - "scipy-2.0/**"
      - ".github/workflows/pixi-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.14

      - name: Run build
        working-directory: scipy-2.0
        run: pixi run build

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: scipy-2.0-paper-pdf
          path: scipy-2.0/build/paper.pdf
          if-no-files-found: error
